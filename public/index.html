<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Chat</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; display:flex; justify-content:center; padding:30px; }
    .card { width:100%; max-width:560px; background:#1e293b; border-radius:12px; padding:24px; }
    h1 { color:#38bdf8; margin:0 0 6px; }
    .tag { background:#334155; padding:2px 10px; border-radius:20px; font-size:12px; margin-right:6px; }
    #messages { height:320px; overflow-y:auto; background:#0f172a; border-radius:8px; padding:10px; margin:14px 0; }
    .msg { margin:6px 0; } .msg b { color:#38bdf8; } .msg small { color:#64748b; }
    .sys { color:#94a3b8; font-style:italic; margin:6px 0; }
    input { padding:10px; border-radius:6px; border:none; margin:4px 0; width:100%; box-sizing:border-box; }
    button { padding:10px 16px; border:none; border-radius:6px; background:#38bdf8; cursor:pointer; }
    .row { display:flex; gap:8px; } .row input { flex:1; }
    #error { color:#f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Live Chat</h1>
    <div><span class="tag" id="env"></span><span class="tag" id="build"></span><span class="tag" id="online">0 online</span></div>

    <div id="login">
      <input id="name" placeholder="Your name">
      <input id="code" type="password" placeholder="Join code">
      <button id="joinBtn">Join chat</button>
      <p id="error"></p>
    </div>

    <div id="chat" style="display:none">
      <div id="messages"></div>
      <div class="row">
        <input id="text" placeholder="Type a message">
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const $ = (id) => document.getElementById(id);

    fetch('/config').then(r => r.json()).then(c => {
      $('title').textContent = c.title;
      document.title = c.title;
      $('env').textContent = 'env: ' + c.env;
      $('build').textContent = 'build #' + c.build;
    });

    $('joinBtn').onclick = () => socket.emit('join', { name: $('name').value, code: $('code').value });
    socket.on('denied', () => { $('error').textContent = 'Wrong join code'; });
    socket.on('joined', () => { $('login').style.display = 'none'; $('chat').style.display = 'block'; $('text').focus(); });

    function send() {
      const t = $('text').value.trim();
      if (t) { socket.emit('message', t); $('text').value = ''; }
    }
    $('sendBtn').onclick = send;
    $('text').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

    function add(el) { $('messages').appendChild(el); $('messages').scrollTop = $('messages').scrollHeight; }
    socket.on('message', m => {
      const d = document.createElement('div'); d.className = 'msg';
      const b = document.createElement('b'); b.textContent = m.name + ': ';
      const s = document.createElement('span'); s.textContent = m.text + ' ';
      const t = document.createElement('small'); t.textContent = m.time;
      d.append(b, s, t); add(d);
    });
    socket.on('system', txt => { const d = document.createElement('div'); d.className = 'sys'; d.textContent = txt; add(d); });
    socket.on('online', n => { $('online').textContent = n + ' online'; });
  </script>
</body>
</html>
